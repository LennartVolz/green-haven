  <path d="M0 952 C 260 924, 540 964, 820 950 C 1120 936, 1400 918, 1660 946 C 1800 962, 1880 950, 1920 956 L1920 1080 L0 1080 Z" fill="#8DB580"/>

  <!-- Feldreihen als weiche Bögen -->
  <g stroke="#A9CE8D" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.8">
    <path d="M120 1012 C 420 986, 700 1018, 960 1004"/>
    <path d="M80 1052 C 400 1024, 720 1056, 1010 1040"/>
  </g>

  <!-- Sprössling, das Markenzeichen -->
  <g>
    <ellipse cx="318" cy="958" rx="74" ry="20" fill="#000000" opacity="0.10"/>
    <ellipse cx="318" cy="948" rx="62" ry="18" fill="#8C5C3A"/>
    <path d="M318 948 C 314 900, 322 874, 316 838" stroke="#6F9A63" stroke-width="12" stroke-linecap="round" fill="none"/>

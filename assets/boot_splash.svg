    <path d="M316 856 C 352 856, 378 832, 382 800 C 342 798, 318 820, 316 856 Z" fill="#6F9A63"/>
    <circle cx="318" cy="986" r="9" fill="#F4C95D"/>
  </g>

  <!-- Kleine Blüten -->
  <g>
    <circle cx="640" cy="992" r="7" fill="#F28BB0"/>
    <circle cx="640" cy="992" r="3" fill="#F6D84A"/>
    <circle cx="742" cy="1026" r="6" fill="#FFFFFF"/>
    <circle cx="742" cy="1026" r="3" fill="#F6D84A"/>
    <circle cx="1620" cy="1006" r="7" fill="#F28BB0"/>
    <circle cx="1620" cy="1006" r="3" fill="#F6D84A"/>
    <circle cx="1690" cy="1042" r="6" fill="#FFFFFF"/>
    <circle cx="1690" cy="1042" r="3" fill="#F6D84A"/>

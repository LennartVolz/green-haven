# Führt bei jedem Push die Tests aus und baut einen installierbaren Android-Debug-APK.
# Der Ablauf folgt dem Standard des Images barichello/godot-ci.
# Der APK ist als Artefakt "GreenHaven-build" abrufbar.
name: android-build
on:
  push:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.4.1"

jobs:
  tests-and-apk:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4

      - name: Logiktests (headless)
        run: |
          godot --headless --path . --editor --quit
          godot --headless --path . -s res://tests/run_tests.gd
          godot --headless --path . -s res://tests/achievements_ui.gd
          godot --headless --path . -s res://tests/save_transfer_ui.gd
          godot --headless --path . -s res://tests/production_overview_ui.gd
          godot --headless --path . -s res://tests/boot_ui.gd
          godot --headless --path . -s res://tests/i18n.gd
          godot --headless --path . -s res://tests/layout_ui.gd

      - name: Export-Templates bereitstellen
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Android-Debug-Keystore und Editor-Einstellungen
        shell: bash
        run: |
          # Das Image bringt Keystore und SDK-Pfad meist schon mit; nur fehlendes ergänzen.
          if [ ! -f /root/debug.keystore ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
              -keystore /root/debug.keystore -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          fi
          godot --headless --quit || true
          SETTINGS=$(ls ~/.config/godot/editor_settings-4*.tres | head -n 1)
          JAVA_HOME_DIR=$(dirname "$(dirname "$(readlink -f "$(which javac)")")")
          setting() { sed -i "\|^$1 = |d" "$SETTINGS"; echo "$1 = \"$2\"" >> "$SETTINGS"; }
          setting export/android/android_sdk_path /usr/lib/android-sdk
          setting export/android/java_sdk_path "$JAVA_HOME_DIR"
          setting export/android/debug_keystore /root/debug.keystore
          setting export/android/debug_keystore_user androiddebugkey
          setting export/android/debug_keystore_pass android
          cat "$SETTINGS" | grep export/android || true

      - name: APK exportieren
        shell: bash
        run: |
          mkdir -p build
          set +e
          godot --headless --path . --export-debug "Android" build/GreenHaven-debug.apk 2>&1 | tee build/export.log
          code=${PIPESTATUS[0]}
          if [ ! -f build/GreenHaven-debug.apk ]; then
            msg=$(tail -c 3000 build/export.log | tr -d '\r' | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=Export-Log (exit ${code})::${msg}"
          fi
          ls -la build || true
          [ -f build/GreenHaven-debug.apk ] && exit 0
          exit ${code:-1}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GreenHaven-build
          path: |
            build/GreenHaven-debug.apk
            build/export.log
